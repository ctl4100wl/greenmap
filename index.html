<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Green Map — THCS Võ Trường Toản</title>

<!-- =====================================================================
     GREEN MAP — 1 FILE, NHIỀU TRANG (hash router)
     #/              Trang chủ
     #/huong-dan     Hướng dẫn
     #/danh-sach     Danh sách cây
     #/du-an         Về dự án
     #/cay/<slug>    Trang chi tiết 1 loài  <-- QR trỏ vào đây
     Sửa nội dung: chỉ đụng khối CONFIG + PAGES ở cuối file.
     ===================================================================== -->

<style>
:root{
  --g900:#14532d; --g700:#1f7a3d; --g500:#2e9e4f;
  --ink:#123021; --paper:#f4faf5; --line:#dde9de;
  --radius:14px; --wrap:1200px;
  --font: system-ui,"Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);color:var(--ink);background:#fff;line-height:1.6}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 20px}

header{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;height:72px;gap:16px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;color:var(--g700);letter-spacing:.5px}
.logo svg{width:28px;height:28px;flex:none}
.menu{display:flex;gap:34px;font-weight:700}
.menu a{padding:6px 0;border-bottom:2px solid transparent}
.menu a:hover{color:var(--g700)}
.menu a.active{color:var(--g700);border-color:var(--g700)}
.burger{display:none;background:none;border:0;font-size:26px;color:var(--g700);cursor:pointer}

.stage{position:relative;width:100%;aspect-ratio:var(--ar,16/7);overflow:hidden;
       background:#eef8ef;container-type:inline-size}
.stage>.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.stage>.veil{position:absolute;inset:0}
.layer{position:absolute}
.t{font-size:calc(var(--fs,4) * 1cqw);line-height:1.1;font-weight:900}

#view{min-height:60vh;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.page{padding:48px 0}
.page h1{font-size:34px;color:var(--g900);margin-bottom:6px}
.page .sub{color:#5b7a66;margin-bottom:26px}
.page h3{font-size:22px;color:var(--g900);margin:28px 0 10px}
.page p{margin-bottom:12px}
.page ol,.page ul{margin:0 0 12px 20px}
.page li{margin-bottom:6px}

.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
      overflow:hidden;transition:transform .15s, box-shadow .15s;display:block}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(20,83,45,.12)}
.card img{aspect-ratio:4/3;object-fit:cover;width:100%;background:#dfeee3}
.card .p{padding:14px}
.card h4{font-size:17px;color:var(--g900)}
.card small{color:#5b7a66}

/* trang chi tiết */
.detail{display:grid;gap:28px;grid-template-columns:1.1fr 1fr;align-items:start}
.gallery{display:grid;gap:10px}
.gallery .main{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:var(--radius);background:#dfeee3}
.thumbs{display:flex;gap:10px;flex-wrap:wrap}
.thumbs img{width:78px;height:60px;object-fit:cover;border-radius:8px;cursor:pointer;
            border:2px solid transparent;background:#dfeee3}
.thumbs img.sel{border-color:var(--g500)}
.facts{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.facts div{display:flex;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);font-size:15px}
.facts div:last-child{border:0}
.facts b{min-width:110px;color:var(--g700)}
.back{display:inline-block;margin-bottom:16px;color:var(--g700);font-weight:700}

.btn{display:inline-block;background:var(--g500);color:#fff;padding:14px 32px;border-radius:999px;
     font-weight:800;box-shadow:0 6px 18px rgba(46,158,79,.35)}
.btn:hover{background:var(--g700)}
.badge{display:inline-block;background:var(--g700);color:#fff;padding:.35em .9em;border-radius:12px;font-weight:800}

footer{background:var(--g900);color:#d9efdd;padding:28px 0;text-align:center;font-size:14px;margin-top:40px}

@media(max-width:820px){
  .menu{display:none;position:absolute;top:72px;left:0;right:0;background:#fff;
        flex-direction:column;gap:0;padding:8px 20px 16px;border-bottom:1px solid var(--line)}
  .menu.open{display:flex}
  .menu a{padding:12px 0;border-bottom:1px solid var(--line)}
  .burger{display:block}
  .stage{--ar:4/5}
  .page h1{font-size:26px}
  .detail{grid-template-columns:1fr}
}
</style>
</head>
<body>

<header>
  <div class="wrap nav">
    <a href="#/" class="logo">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21c0-6 3-10 8-12-1 7-4 10-8 12z"/><path d="M12 21C9 16 5 14 2 14c2 5 6 7 10 7z"/></svg>
      <span id="brand"></span>
    </a>
    <nav class="menu" id="menu"></nav>
    <button class="burger" id="burger" aria-label="Menu">&#9776;</button>
  </div>
</header>

<div id="view"></div>
<footer id="foot"></footer>

<!-- =====================================================================
     CONFIG — SỬA Ở ĐÂY
     ===================================================================== -->
<script>
const CONFIG = {
  brand: "GREEN MAP",
  footer: "© 2026 Green Map — THCS Võ Trường Toản",
  hero: {
    image:"assets/hero.jpg",
    h1:"GREEN MAP",
    h2:"BẢN ĐỒ CÂY XANH TRONG TRƯỜNG",
    school:"THCS VÕ TRƯỜNG TOẢN",
    lead:"Khám phá và tìm hiểu các loài cây trong khuôn viên trường qua bản đồ trực quan và mã QR.",
    cta:"🌳 KHÁM PHÁ CÂY XANH"
  },

  /* slug = phần sau #/cay/... , dùng để in QR. Đừng đổi slug sau khi đã in QR. */
  trees: [
    { slug:"sake", name:"Sa kê", sci:"Artocarpus altilis",
      imgs:["assets/sake.webp","assets/sake2.webp"],
      note:"Lá xẻ thùy sâu rất đặc trưng, quả ăn được." },

    { slug:"phuong-vy", name:"Phượng vĩ", sci:"Delonix regia",
      imgs:["assets/pvy.webp","assets/pvy2.webp"],
      note:"Hoa đỏ rực nở vào mùa hè, gắn với tuổi học trò." },

    { slug:"bang-lang-tim", name:"Bằng lăng tím", sci:"Lagerstroemia speciosa",
      imgs:["assets/bang-lang-tim.webp","assets/bang-lang-tim2.webp"],
      note:"Hoa tím nở thành chùm lớn vào đầu mùa mưa." },

    { slug:"cay-dau", name:"Cây dầu", sci:"Dipterocarpus alatus",
      imgs:["assets/cay-dau.webp","assets/cay-dau2.webp","assets/cay-dau3.webp"],
      note:"Thân thẳng, cao; quả có hai cánh xoay khi rơi." },

    { slug:"bang-dai-loan", name:"Bàng Đài Loan", sci:"Terminalia mantaly",
      imgs:["assets/bang-dai-loan.webp","assets/bang-dai-loan2.webp"],
      note:"Tán xòe nhiều tầng, lá nhỏ, cho bóng mát tốt." },

    { slug:"diep-vang", name:"Điệp vàng", sci:"Peltophorum pterocarpum",
      imgs:["assets/diepvang.webp","assets/diepvang2.webp"],
      note:"Hoa vàng thành chùm đứng, tán rộng." },

    { slug:"cay-si", name:"Cây si", sci:"Ficus benjamina",
      imgs:["assets/caysi.webp","assets/caysi2.webp"],
      note:"Rễ phụ buông từ cành xuống, tán dày quanh năm." },

    { slug:"hoa-mong-bo", name:"Hoa móng bò", sci:"Bauhinia purpurea",
      imgs:["assets/hoamongbo.webp","assets/hoamongbo2.webp"],
      note:"Lá chẻ đôi giống dấu móng bò, hoa tím hồng." },

    { slug:"cay-de", name:"Cây đề", sci:"Ficus religiosa",
      imgs:["assets/cayde1.webp","assets/cayde2.webp"],
      note:"Lá hình tim với đuôi nhọn kéo dài rất dễ nhận ra." },

    { slug:"xoai", name:"Xoài", sci:"Mangifera indica",
      imgs:["assets/xoai.webp","assets/xoai2.webp"],
      note:"Cây ăn quả, tán dày, lá non màu đỏ tía." },

    { slug:"hoang-ngoc-lan", name:"Hoàng ngọc lan", sci:"Magnolia champaca",
      imgs:["assets/hoangoclan.webp","assets/hoangoclan2.webp"],
      note:"Hoa vàng cam, hương thơm nồng lan xa." },

    { slug:"but-tung", name:"Bút tùng", sci:"",
      imgs:["assets/buttung.webp","assets/buttung2.webp"],
      note:"Dáng cây thẳng đứng hình tháp." }
  ]
};

/* ---------- ROUTES ---------- */
const PAGES = {

  "/": {
    label:"Trang chủ", title:"Green Map",
    render(){ const h = CONFIG.hero; return `
      <div class="stage">
        <img class="bg" src="${h.image}" alt="" onerror="this.remove()">
        <div class="veil" style="background:linear-gradient(90deg,#eef8effa 0%,#eef8efe6 45%,#eef8ef00 78%)"></div>
        <div class="layer" style="left:6%;top:20%;width:56%">
          <div class="t" style="--fs:7.5;color:var(--g900);letter-spacing:-.02em">${h.h1}</div>
          <div class="t" style="--fs:3.1;color:var(--g700);margin-top:.4em">${h.h2}</div>
          <div class="badge t" style="--fs:2.6;margin-top:.7em">${h.school}</div>
          <p style="font-size:calc(1.35cqw + 6px);margin-top:1em;color:#2c4a37">${h.lead}</p>
          <a class="btn" href="#/danh-sach" style="margin-top:1.2em;font-size:calc(1.2cqw + 6px)">${h.cta}</a>
        </div>
      </div>
      <div class="wrap page">
        <h3>Có gì trong trường?</h3>
        <p>${CONFIG.trees.length} loài cây đã được ghi nhận và gắn mã QR.</p>
        <div class="grid">
          ${CONFIG.trees.slice(0,4).map(cardHTML).join("")}
        </div>
        <p style="margin-top:22px"><a href="#/danh-sach" style="color:var(--g700);font-weight:700">Xem tất cả →</a></p>
      </div>`;
    }
  },

  "/huong-dan": {
    label:"Hướng dẫn", title:"Hướng dẫn — Green Map",
    render(){ return `
      <div class="wrap page">
        <h1>Hướng dẫn</h1>
        <div class="sub">Ba bước để tra cứu một cây trong trường.</div>
        <div style="display:grid;gap:24px;grid-template-columns:1fr 320px;align-items:start">
          <ol>
            <li>Mở camera điện thoại, đưa vào mã QR gắn trên thân cây.</li>
            <li>Bấm vào đường link hiện ra — trang thông tin của cây sẽ mở.</li>
            <li>Không có QR? Vào <a href="#/danh-sach" style="color:var(--g700)">Danh sách cây</a> và tìm theo tên.</li>
          </ol>
          <img src="assets/qr-scan.webp" alt="Quét mã QR"
               style="border-radius:var(--radius)" onerror="this.remove()">
        </div>
      </div>`;
    }
  },

  "/danh-sach": {
    label:"Danh sách cây", title:"Danh sách cây — Green Map",
    render(){ return `
      <div class="wrap page">
        <h1>Danh sách cây</h1>
        <div class="sub">${CONFIG.trees.length} loài đã ghi nhận trong khuôn viên trường.</div>
        <div class="grid">${CONFIG.trees.map(cardHTML).join("")}</div>
      </div>`;
    }
  },

  "/du-an": {
    label:"Về dự án", title:"Về dự án — Green Map",
    render(){ return `
      <div class="wrap page">
        <h1>Về dự án</h1>
        <div class="sub">Số hoá cây xanh trong khuôn viên THCS Võ Trường Toản.</div>
        <p>Dự án do học sinh thực hiện: khảo sát, chụp ảnh và gắn mã QR lên từng cây,
           kèm bản đồ trực quan giúp mọi người tra cứu nhanh thông tin loài cây.</p>
      </div>`;
    }
  }
};

/* ---------- HELPERS ---------- */
const $ = s => document.querySelector(s);
const treeBySlug = s => CONFIG.trees.find(t => t.slug === s);

function cardHTML(t){ return `
  <a class="card" href="#/cay/${t.slug}">
    <img src="${t.imgs[0]}" alt="${t.name}" loading="lazy" onerror="this.removeAttribute('src')">
    <div class="p"><h4>${t.name}</h4><small><i>${t.sci || "—"}</i></small></div>
  </a>`;
}

function treePage(t){ return `
  <div class="wrap page">
    <a class="back" href="#/danh-sach">← Danh sách cây</a>
    <h1>${t.name}</h1>
    <div class="sub"><i>${t.sci || "Đang cập nhật tên khoa học"}</i></div>
    <div class="detail">
      <div class="gallery">
        <img class="main" id="mainImg" src="${t.imgs[0]}" alt="${t.name}" onerror="this.removeAttribute('src')">
        <div class="thumbs">
          ${t.imgs.map((src,i)=>`<img src="${src}" alt="" data-src="${src}"
              class="${i===0?'sel':''}" onerror="this.remove()">`).join("")}
        </div>
      </div>
      <div>
        <div class="facts">
          <div><b>Tên thường</b><span>${t.name}</span></div>
          <div><b>Tên khoa học</b><span>${t.sci || "—"}</span></div>
          <div><b>Đặc điểm</b><span>${t.note || "—"}</span></div>
          <div><b>Mã QR</b><span>#/cay/${t.slug}</span></div>
        </div>
      </div>
    </div>
  </div>`;
}

/* ---------- ROUTER ---------- */
$("#brand").textContent = CONFIG.brand;
$("#foot").textContent  = CONFIG.footer;
$("#menu").innerHTML = Object.entries(PAGES)
  .map(([p,o]) => `<a href="#${p}" data-path="${p}">${o.label}</a>`).join("");

function router(){
  const path = location.hash.replace(/^#/,"") || "/";
  let html, title, navPath = path;

  if(path.startsWith("/cay/")){
    const t = treeBySlug(path.slice(5));
    if(t){ html = treePage(t); title = t.name + " — Green Map"; navPath = "/danh-sach"; }
  }
  if(!html){
    const page = PAGES[path] || PAGES["/"];
    html = page.render(); title = page.title;
    if(!PAGES[path]) navPath = "/";
  }

  document.title = title;
  $("#view").innerHTML = html;
  document.querySelectorAll("#menu a").forEach(a =>
    a.classList.toggle("active", a.dataset.path === navPath));
  $("#menu").classList.remove("open");
  window.scrollTo(0,0);

  // đổi ảnh lớn khi bấm thumbnail
  document.querySelectorAll(".thumbs img").forEach(img => img.onclick = () => {
    $("#mainImg").src = img.dataset.src;
    document.querySelectorAll(".thumbs img").forEach(x => x.classList.remove("sel"));
    img.classList.add("sel");
  });
}
addEventListener("hashchange", router);
router();
$("#burger").onclick = () => $("#menu").classList.toggle("open");
</script>
</body>
</html>
