<!-- =====================================================================
     GREEN MAP — 1 FILE, NHIỀU TRANG (hash router)
     #/              Trang chủ
     #/huong-dan     Hướng dẫn
     #/danh-sach     Danh sách cây
     #/du-an         Về dự án
     #/cay/<slug>    Trang chi tiết 1 loài   <-- QR trỏ vào đây
     #/qr            Tạo QR hàng loạt + in   (trang ẩn, không có trên menu)
     Sửa nội dung: chỉ đụng khối CONFIG ở cuối file.
     ===================================================================== -->

<style>
:root{
  --g900:#14532d; --g700:#1f7a3d; --g500:#2e9e4f; --g100:#e8f5ea;
  --ink:#123021; --mut:#5b7a66; --paper:#f4faf5; --line:#dde9de;
  --radius:16px; --wrap:1200px;
  --font: system-ui,"Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);color:var(--ink);background:#fff;line-height:1.65}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 20px}

/* ---------- HEADER ---------- */
header{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;height:72px;gap:16px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;color:var(--g700);letter-spacing:.5px}
.logo svg{width:28px;height:28px;flex:none}
.menu{display:flex;gap:34px;font-weight:700}
.menu a{padding:6px 0;border-bottom:2px solid transparent}
.menu a:hover{color:var(--g700)}
.menu a.active{color:var(--g700);border-color:var(--g700)}
.burger{display:none;background:none;border:0;font-size:26px;color:var(--g700);cursor:pointer}

/* ---------- HERO ---------- */
.stage{position:relative;width:100%;aspect-ratio:var(--ar,16/7);overflow:hidden;
       background:#eef8ef;container-type:inline-size}
.stage>.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.stage>.veil{position:absolute;inset:0}
.layer{position:absolute}
.t{font-size:calc(var(--fs,4) * 1cqw);line-height:1.1;font-weight:900}

/* ---------- PAGE ---------- */
#view{min-height:60vh;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.page{padding:48px 0}
.page h1{font-size:34px;color:var(--g900);margin-bottom:6px;line-height:1.2}
.page .sub{color:var(--mut);margin-bottom:26px}
.page h3{font-size:22px;color:var(--g900);margin:28px 0 10px}
.page ol,.page ul{margin:0 0 12px 20px}
.page li{margin-bottom:6px}

.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
      overflow:hidden;transition:transform .15s,box-shadow .15s;display:block}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 22px rgba(20,83,45,.13)}
.card img{aspect-ratio:4/3;object-fit:cover;width:100%;background:#dfeee3}
.card .p{padding:14px}
.card h4{font-size:17px;color:var(--g900)}
.card small{color:var(--mut)}

.btn{display:inline-block;background:var(--g500);color:#fff;padding:14px 32px;border-radius:999px;
     font-weight:800;border:0;cursor:pointer;font-size:16px;font-family:inherit;
     box-shadow:0 6px 18px rgba(46,158,79,.35)}
.btn:hover{background:var(--g700)}
.btn.ghost{background:#fff;color:var(--g700);border:2px solid var(--g500);box-shadow:none}
.badge{display:inline-block;background:var(--g700);color:#fff;padding:.35em .9em;border-radius:12px;font-weight:800}

/* ---------- TRANG CHI TIẾT CÂY ---------- */
.back{display:inline-block;margin-bottom:18px;color:var(--g700);font-weight:700}
.tree-head{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:30px;align-items:start}
.tree-title h1{font-size:clamp(28px,4vw,42px);color:var(--g900);margin:0}
.tree-title .sci{font-style:italic;color:var(--mut);font-size:18px;margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{background:var(--g100);color:var(--g700);border-radius:999px;padding:6px 14px;
      font-size:13.5px;font-weight:700}

.gallery{display:grid;gap:10px}
.gallery .main{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:var(--radius);
               background:#dfeee3;box-shadow:0 10px 30px rgba(20,83,45,.14)}
.thumbs{display:flex;gap:10px;flex-wrap:wrap}
.thumbs img{width:84px;height:64px;object-fit:cover;border-radius:10px;cursor:pointer;
            border:2px solid transparent;background:#dfeee3}
.thumbs img.sel{border-color:var(--g500)}

.info{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));margin-top:34px}
.info .box{border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;background:#fff}
.info .box h4{display:flex;align-items:center;gap:9px;font-size:15px;letter-spacing:.04em;
              text-transform:uppercase;color:var(--g700);margin-bottom:8px}
.info .box .ico{font-size:19px;line-height:1}
.info .box p{font-size:16px;color:#2c4a37}
.info .box.wide{grid-column:1/-1;background:linear-gradient(180deg,var(--g100),#fff);
                border-color:#cfe6d4}

.nextprev{display:flex;justify-content:space-between;gap:12px;margin-top:38px;
          border-top:1px solid var(--line);padding-top:20px;font-weight:700;color:var(--g700)}

/* ---------- TRANG QR ---------- */
.qr-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));margin-top:22px}
.qr-item{border:2px dashed #b9d4bf;border-radius:12px;padding:14px;text-align:center;background:#fff}
.qr-item canvas{width:100%!important;height:auto!important;max-width:180px;margin:0 auto}
.qr-item .nm{font-weight:800;color:var(--g900);margin-top:8px;font-size:15px}
.qr-item .sc{font-style:italic;color:var(--mut);font-size:12.5px}
.qr-item .url{font-size:10.5px;color:#8aa693;word-break:break-all;margin-top:4px}

footer{background:var(--g900);color:#d9efdd;padding:28px 0;text-align:center;font-size:14px;margin-top:40px}

/* ---------- MOBILE ---------- */
@media(max-width:880px){
  .menu{display:none;position:absolute;top:72px;left:0;right:0;background:#fff;
        flex-direction:column;gap:0;padding:8px 20px 16px;border-bottom:1px solid var(--line)}
  .menu.open{display:flex}
  .menu a{padding:12px 0;border-bottom:1px solid var(--line)}
  .burger{display:block}
  .stage{--ar:4/5}
  .page{padding:32px 0}
  .page h1{font-size:26px}
  .tree-head{grid-template-columns:1fr;gap:20px}
  .tree-head .gallery{order:-1}
  .thumbs img{width:64px;height:50px}
  .info{margin-top:26px}
  .info .box{padding:16px 18px}
}

/* ---------- IN QR ---------- */
@media print{
  header,footer,.noprint{display:none!important}
  body{background:#fff}
  .qr-grid{grid-template-columns:repeat(3,1fr)}
  .qr-item{break-inside:avoid;border-color:#999}
}
</style>
</head>

const $  = s => document.querySelector(s);

const baseURL = () => location.href.split("#")[0];

  <a class="card" href="#/cay/${t.slug}">
    <img src="${t.imgs[0]}" alt="${t.name}" loading="lazy" onerror="this.removeAttribute('src')">
    <div class="p"><h4>${t.name}</h4><small><i>${t.sci || "—"}</i></small></div>
  </a>`;
}

  return `
  <div class="wrap page">
    <a class="back" href="#/danh-sach">← Danh sách cây</a>

    <div class="tree-head">
      <div class="tree-title">
        <h1>${t.name}</h1>
        <div class="sci">${t.sci || "Đang cập nhật tên khoa học"}</div>
        <div class="chips">
          ${t.family ? `<span class="chip">🌿 ${t.family}</span>` : ""}
          ${t.alias  ? `<span class="chip">🏷️ ${t.alias}</span>` : ""}
          <span class="chip">📍 THCS Võ Trường Toản</span>
        </div>
        <div class="info" style="margin-top:22px;grid-template-columns:1fr">
          ${box("🔎","Đặc điểm nhận biết", t.desc)}
        </div>
      </div>

      <div class="gallery">
        <img class="main" id="mainImg" src="${t.imgs[0]}" alt="${t.name}" onerror="this.removeAttribute('src')">
        <div class="thumbs">
          ${t.imgs.map((src,k)=>`<img src="${src}" alt="" data-src="${src}"
             class="${k===0?'sel':''}" onerror="this.remove()">`).join("")}
        </div>
      </div>
    </div>

    <div class="info">
      ${box("🧺","Công dụng", t.uses)}
      ${box("🌍","Giá trị sinh thái", t.eco)}
      ${t.fun ? `<div class="box wide">
          <h4><span class="ico">✨</span>${t.funLabel || "Điều thú vị"}</h4>
          <p>${t.fun}</p>
        </div>` : ""}
    </div>

    <div class="nextprev">
      <a href="#/cay/${prev.slug}">← ${prev.name}</a>
      <a href="#/cay/${next.slug}">${next.name} →</a>
    </div>
  </div>`;
}

/* ---------- TRANG TẠO QR HÀNG LOẠT ---------- */
function qrPage(){ return `
  <div class="wrap page">
    <h1>Tạo mã QR hàng loạt</h1>
    <div class="sub noprint">Mỗi mã trỏ tới trang chi tiết của một cây. Bấm “In” để in ra giấy dán, hoặc bấm từng mã để tải PNG.</div>
    <div class="noprint" style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:6px">
      <button class="btn" onclick="window.print()">🖨️ In tất cả</button>
      <button class="btn ghost" onclick="downloadAllQR()">⬇️ Tải tất cả PNG</button>
    </div>
    <div class="qr-grid" id="qrGrid"></div>
  </div>`;
}

function loadQRLib(){
  if(window.QRCode) return Promise.resolve();
  return new Promise((ok,err)=>{
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js";
    s.onload = ok; s.onerror = err;
    document.head.appendChild(s);
  });
}

async function renderQR(){
  const grid = $("#qrGrid");
  try { await loadQRLib(); }
  catch { grid.innerHTML = "<p>Không tải được thư viện QR. Kiểm tra kết nối mạng.</p>"; return; }

  grid.innerHTML = CONFIG.trees.map(t => `
    <div class="qr-item">
      <canvas data-slug="${t.slug}"></canvas>
      <div class="nm">${t.name}</div>
      <div class="sc">${t.sci || ""}</div>
      <div class="url noprint">${baseURL()}#/cay/${t.slug}</div>
    </div>`).join("");

  $$("#qrGrid canvas").forEach(cv => {
    const url = baseURL() + "#/cay/" + cv.dataset.slug;
    QRCode.toCanvas(cv, url, { width:520, margin:1, errorCorrectionLevel:"M",
                               color:{ dark:"#14532d", light:"#ffffff" } });
    cv.style.cursor = "pointer";
    cv.title = "Bấm để tải PNG";
    cv.onclick = () => saveCanvas(cv, cv.dataset.slug);
  });
}

function saveCanvas(cv, name){
  const a = document.createElement("a");
  a.download = "qr-" + name + ".png";
  a.href = cv.toDataURL("image/png");
  a.click();
}
function downloadAllQR(){
  $$("#qrGrid canvas").forEach((cv,i) =>
    setTimeout(() => saveCanvas(cv, cv.dataset.slug), i * 350));
}

/* ---------- ROUTES ---------- */

  "/huong-dan": {

      <div class="wrap page">

          </ol>
          <img src="assets/qr-scan.webp" alt="Quét mã QR"
               style="border-radius:var(--radius)" onerror="this.remove()">
        </div>
      </div>`;
    }
  },

  "/danh-sach": {
    label:"Danh sách cây", title:"Danh sách cây — Green Map", inMenu:true,
    render(){ return `
      <div class="wrap page">
        <h1>Danh sách cây</h1>
        <div class="sub">${CONFIG.trees.length} loài đã ghi nhận trong khuôn viên trường.</div>
        <div class="grid">${CONFIG.trees.map(cardHTML).join("")}</div>
      </div>`;
    }
  },

  "/du-an": {
    label:"Về dự án", title:"Về dự án — Green Map", inMenu:true,
    render(){ return `
      <div class="wrap page">
        <h1>Về dự án</h1>
        <div class="sub">Số hoá cây xanh trong khuôn viên THCS Võ Trường Toản.</div>
        <p>Dự án do học sinh thực hiện: khảo sát, chụp ảnh và gắn mã QR lên từng cây,
           kèm bản đồ trực quan giúp mọi người tra cứu nhanh thông tin loài cây.</p>

/* ---------- ROUTER ---------- */
$("#brand").textContent = CONFIG.brand;
$("#foot").textContent  = CONFIG.footer;
$("#menu").innerHTML = Object.entries(PAGES).filter(([,o]) => o.inMenu)
  .map(([p,o]) => `<a href="#${p}" data-path="${p}">${o.label}</a>`).join("");

function router(){
  const path = location.hash.replace(/^#/,"") || "/";
  let html, title, navPath = path, after = null;

  if(path.startsWith("/cay/")){
    const i = idxOf(path.slice(5));
    if(i > -1){ html = treePage(CONFIG.trees[i], i);
                title = CONFIG.trees[i].name + " — Green Map"; navPath = "/danh-sach"; }
  }
  if(!html){
    const page = PAGES[path] || PAGES["/"];
    html = page.render(); title = page.title; after = page.after;
    if(!PAGES[path]) navPath = "/";
  }

  document.title = title;
  $("#view").innerHTML = html;
  $$("#menu a").forEach(a => a.classList.toggle("active", a.dataset.path === navPath));
  $("#menu").classList.remove("open");
  window.scrollTo(0,0);

  $$(".thumbs img").forEach(img => img.onclick = () => {
    $("#mainImg").src = img.dataset.src;
    $$(".thumbs img").forEach(x => x.classList.remove("sel"));
    img.classList.add("sel");
  });

  if(after) after();
}
addEventListener("hashchange", router);
router();
$("#burger").onclick = () => $("#menu").classList.toggle("open");
</script>
