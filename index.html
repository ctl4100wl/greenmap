<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Green Map — THCS Võ Trường Toản</title>

<!-- =====================================================================
     GREEN MAP  —  1 file duy nhất, chạy trên GitHub Pages

     TRANG
       #/            Trang chủ            #/cay/<slug>  Chi tiết 1 loài
       #/huong-dan   Hướng dẫn            #/qr          Tạo QR hàng loạt (ẩn)
       #/danh-sach   Danh sách cây        #/admin       Bảng quản trị (ẩn)
       #/du-an       Về dự án

     SỬA NỘI DUNG — 2 cách
       A. Vào #/admin, sửa bằng form, bấm "Tải data.json",
          rồi upload data.json lên repo (cùng cấp index.html). XONG.
       B. Sửa trực tiếp khối DATA ở cuối file này.
     Nếu repo có data.json thì nó được ưu tiên, không có thì dùng DATA gốc.
     ===================================================================== -->

<style>
:root{
  --g900:#14532d; --g700:#1f7a3d; --g500:#2e9e4f; --g100:#e8f5ea;
  --ink:#123021; --mut:#5b7a66; --paper:#f4faf5; --line:#dde9de;
  --radius:16px; --wrap:1200px;
  --font: system-ui,"Segoe UI",Roboto,Arial,sans-serif;
  --ease: cubic-bezier(.22,.9,.3,1);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);color:var(--ink);background:#fff;line-height:1.65}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 20px}
button,input,textarea,select{font-family:inherit;font-size:inherit}

/* ================= ANIMATION ================= */
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:scale(.94) translateY(10px)}to{opacity:1;transform:none}}
@keyframes slideDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.reveal{opacity:0;transform:translateY(18px)}
.reveal.in{animation:fadeUp .55s var(--ease) forwards}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
  .reveal{opacity:1;transform:none}
}

/* ================= HEADER ================= */
header{position:sticky;top:0;z-index:60;background:#fff;border-bottom:1px solid var(--line);
       transition:box-shadow .3s var(--ease)}
header.stuck{box-shadow:0 4px 18px rgba(20,83,45,.09)}
.nav{display:flex;align-items:center;justify-content:space-between;height:72px;gap:16px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;color:var(--g700);letter-spacing:.5px}
.logo svg{width:28px;height:28px;flex:none;transition:transform .4s var(--ease)}
.logo:hover svg{transform:rotate(-12deg) scale(1.1)}
.menu{display:flex;gap:34px;font-weight:700}
.menu a{padding:6px 0;position:relative;transition:color .2s}
.menu a::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--g700);
               transform:scaleX(0);transform-origin:left;transition:transform .28s var(--ease)}
.menu a:hover{color:var(--g700)}
.menu a:hover::after,.menu a.active::after{transform:scaleX(1)}
.menu a.active{color:var(--g700)}
.burger{display:none;background:none;border:0;font-size:26px;color:var(--g700);cursor:pointer}

/* ================= HERO ================= */
.hero{position:relative;overflow:hidden;display:grid;
      grid-template-columns:minmax(0,1.02fr) minmax(0,.98fr);
      background:linear-gradient(115deg,#f6fdf7 0%,#eaf7ec 45%,#dff1e3 100%)}
.hero-txt{position:relative;z-index:3;align-self:center;
          padding:clamp(30px,4.4vw,66px) clamp(20px,4vw,60px)}
.hero-txt>*{animation:fadeUp .7s var(--ease) both}
.hero-txt>*:nth-child(2){animation-delay:.08s}
.hero-txt>*:nth-child(3){animation-delay:.16s}
.hero-txt>*:nth-child(4){animation-delay:.24s}
.hero-txt>*:nth-child(5){animation-delay:.32s}
.hero-h1{font-size:clamp(40px,6.2vw,82px);font-weight:900;line-height:1;
         color:var(--g900);letter-spacing:-.025em}
.hero-h2{font-size:clamp(16px,2.35vw,31px);font-weight:800;color:var(--g700);
         text-transform:uppercase;margin-top:.35em;line-height:1.2}
.hero-badge{margin-top:16px;font-size:clamp(14px,1.65vw,22px);letter-spacing:.02em;
            padding:.5em 1.3em;border-radius:14px;text-transform:uppercase}
.hero-lead{margin-top:18px;font-size:clamp(14.5px,1.25vw,18px);color:#2c4a37;max-width:26em}
.hero-cta{margin-top:24px;font-size:clamp(14.5px,1.15vw,17px);letter-spacing:.02em}
.hero-photo{position:relative;z-index:1;align-self:stretch;animation:fadeIn .9s var(--ease) both}
.hero-photo img{width:100%;height:100%;object-fit:cover;object-position:70% center}
.hero .leaf{position:absolute;top:-14px;left:-18px;width:clamp(130px,17vw,260px);
            opacity:.5;z-index:2;pointer-events:none;color:var(--g500);
            animation:sway 7s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(0)}50%{transform:rotate(5deg)}}
.hero .wave{position:absolute;left:0;right:0;bottom:-1px;width:100%;height:auto;z-index:2;pointer-events:none}

/* ================= PAGE ================= */
#view{min-height:60vh;animation:fadeIn .3s var(--ease)}
.page{padding:48px 0}
.page h1{font-size:34px;color:var(--g900);margin-bottom:6px;line-height:1.2}
.page .sub{color:var(--mut);margin-bottom:26px}
.page h3{font-size:22px;color:var(--g900);margin:28px 0 10px}
.page ol,.page ul{margin:0 0 12px 20px}
.page li{margin-bottom:6px}

.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
      overflow:hidden;display:block;transition:transform .28s var(--ease),box-shadow .28s var(--ease)}
.card:hover{transform:translateY(-5px);box-shadow:0 12px 26px rgba(20,83,45,.15)}
.card .thumb{overflow:hidden}
.card img{aspect-ratio:4/3;object-fit:cover;width:100%;background:#dfeee3;
          transition:transform .5s var(--ease)}
.card:hover img{transform:scale(1.06)}
.card .p{padding:14px}
.card h4{font-size:17px;color:var(--g900)}
.card small{color:var(--mut)}

.btn{display:inline-block;background:var(--g500);color:#fff;padding:14px 32px;border-radius:999px;
     font-weight:800;border:0;cursor:pointer;font-size:16px;
     box-shadow:0 6px 18px rgba(46,158,79,.35);
     transition:transform .2s var(--ease),background .2s,box-shadow .2s}
.btn:hover{background:var(--g700);transform:translateY(-2px);box-shadow:0 10px 24px rgba(46,158,79,.4)}
.btn:active{transform:translateY(0)}
.btn.ghost{background:#fff;color:var(--g700);border:2px solid var(--g500);box-shadow:none}
.btn.sm{padding:8px 16px;font-size:14px;box-shadow:none}
.badge{display:inline-block;background:var(--g700);color:#fff;padding:.35em .9em;border-radius:12px;font-weight:800}

/* ================= CHI TIẾT CÂY ================= */
.back{display:inline-block;margin-bottom:18px;color:var(--g700);font-weight:700;transition:transform .2s}
.back:hover{transform:translateX(-4px)}
.tree-head{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:30px;align-items:center}
.tree-head:not(:has(.gallery)){grid-template-columns:1fr}
.tree-title h1{font-size:clamp(28px,4vw,42px);color:var(--g900);margin:0}
.tree-title .sci{font-style:italic;color:var(--mut);font-size:18px;margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{background:var(--g100);color:var(--g700);border-radius:999px;padding:6px 14px;
      font-size:13.5px;font-weight:700}

.gallery{display:grid;gap:10px}
.frame{position:relative;border-radius:var(--radius);overflow:hidden;
       box-shadow:0 10px 30px rgba(20,83,45,.14);background:#dfeee3}
.frame img.main{width:100%;aspect-ratio:4/3;object-fit:cover;animation:fadeIn .35s var(--ease)}
.arrow{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;
       border:0;cursor:pointer;background:rgba(255,255,255,.9);color:var(--g900);font-size:20px;
       display:grid;place-items:center;box-shadow:0 3px 12px rgba(0,0,0,.18);
       opacity:0;transition:opacity .25s,transform .2s var(--ease)}
.frame:hover .arrow,.frame:focus-within .arrow{opacity:1}
.arrow:hover{transform:translateY(-50%) scale(1.1);background:#fff}
.arrow.prev{left:12px} .arrow.next{right:12px}
.counter{position:absolute;right:12px;bottom:12px;background:rgba(20,83,45,.82);color:#fff;
         font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:999px}
.thumbs{display:flex;gap:10px;flex-wrap:wrap}
.thumbs img{width:84px;height:64px;object-fit:cover;border-radius:10px;cursor:pointer;
            border:2px solid transparent;background:#dfeee3;opacity:.72;
            transition:opacity .2s,border-color .2s,transform .2s var(--ease)}
.thumbs img:hover{opacity:1;transform:translateY(-2px)}
.thumbs img.sel{border-color:var(--g500);opacity:1}
.hint{font-size:12.5px;color:var(--mut)}

.info{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));margin-top:34px}
.info .box{border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;background:#fff;
           transition:border-color .25s,box-shadow .25s}
.info .box:hover{border-color:#bfdcc6;box-shadow:0 6px 18px rgba(20,83,45,.07)}
.info .box h4{display:flex;align-items:center;gap:9px;font-size:15px;letter-spacing:.04em;
              text-transform:uppercase;color:var(--g700);margin-bottom:8px}
.info .box .ico{font-size:19px;line-height:1}
.info .box p{font-size:16px;color:#2c4a37}
.info .box.wide{grid-column:1/-1}
.info .box.fun{background:linear-gradient(180deg,var(--g100),#fff);border-color:#cfe6d4}
.nextprev{display:flex;justify-content:space-between;gap:12px;margin-top:38px;
          border-top:1px solid var(--line);padding-top:20px;font-weight:700;color:var(--g700)}
.nextprev a{transition:transform .2s}
.nextprev a:first-child:hover{transform:translateX(-4px)}
.nextprev a:last-child:hover{transform:translateX(4px)}

/* ================= QR ================= */
.qr-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));margin-top:22px}
.qr-item{border:2px dashed #b9d4bf;border-radius:12px;padding:14px;text-align:center;background:#fff;
         animation:popIn .4s var(--ease) both}
.qr-item canvas{width:100%!important;height:auto!important;max-width:180px;margin:0 auto;cursor:pointer}
.qr-item .nm{font-weight:800;color:var(--g900);margin-top:8px;font-size:15px}
.qr-item .sc{font-style:italic;color:var(--mut);font-size:12.5px}
.qr-item .url{font-size:10.5px;color:#8aa693;word-break:break-all;margin-top:4px}

/* ================= SCANNER ================= */
#scan{position:fixed;inset:0;z-index:100;background:rgba(8,28,16,.92);
      display:none;align-items:center;justify-content:center;padding:20px;animation:fadeIn .2s}
#scan.on{display:flex}
#scan .panel{width:min(460px,100%);background:#fff;border-radius:20px;overflow:hidden;
             animation:popIn .3s var(--ease)}
#scan .top{display:flex;align-items:center;justify-content:space-between;
           padding:14px 18px;border-bottom:1px solid var(--line)}
#scan .top b{color:var(--g900);font-size:17px}
#scan .x{background:none;border:0;font-size:26px;line-height:1;cursor:pointer;color:var(--mut)}
#reader{width:100%;background:#000;min-height:260px}
#reader video{width:100%!important;display:block}
#scan .msg{padding:14px 18px;font-size:14.5px;color:var(--mut);text-align:center}
#scan .msg a{color:var(--g700);font-weight:700;word-break:break-all}

/* ================= ADMIN ================= */
.adm-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;position:sticky;top:72px;z-index:20;
         background:#fff;padding:12px 0;border-bottom:1px solid var(--line)}
.adm-note{background:var(--g100);border-radius:12px;padding:14px 18px;font-size:14.5px;margin-bottom:20px}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:12.5px;font-weight:800;color:var(--g700);
           text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.fld input,.fld textarea{width:100%;border:1px solid var(--line);border-radius:10px;
     padding:10px 12px;font-size:15px;color:var(--ink);background:#fff;transition:border-color .2s}
.fld input:focus,.fld textarea:focus{outline:0;border-color:var(--g500)}
.fld textarea{resize:vertical;min-height:70px;line-height:1.5}
.cols{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.acc{border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden;background:#fff}
.acc>summary{cursor:pointer;padding:13px 16px;font-weight:800;color:var(--g900);
             display:flex;align-items:center;gap:10px;list-style:none}
.acc>summary::-webkit-details-marker{display:none}
.acc>summary:hover{background:var(--paper)}
.acc[open]>summary{border-bottom:1px solid var(--line);background:var(--paper)}
.acc .body{padding:16px;animation:slideDown .25s var(--ease)}
.acc .tag{margin-left:auto;font-size:12px;font-weight:700;color:var(--mut)}
.rowbtn{display:flex;gap:6px}
.rowbtn button{border:1px solid var(--line);background:#fff;border-radius:8px;width:32px;height:32px;
               cursor:pointer;color:var(--g700);transition:background .2s}
.rowbtn button:hover{background:var(--g100)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--g900);color:#fff;
       padding:12px 22px;border-radius:999px;font-weight:700;z-index:200;animation:popIn .3s var(--ease)}

/* -- quản lý ảnh -- */
.tag.img-tag{padding:2px 8px;border-radius:6px;background:var(--paper)}
.tag.img-tag.ok{color:#1f7a3d;background:#e3f5e6}
.tag.img-tag.bad{color:#a33;background:#fbe7e7}

.imgfield{display:flex;gap:12px;align-items:flex-start}
.imgprev{flex:none;width:88px;height:66px;border-radius:10px;overflow:hidden;
         background:var(--paper);border:1px solid var(--line)}
.imgprev img{width:100%;height:100%;object-fit:cover}
.imgph{width:100%;height:100%;display:grid;place-items:center;font-size:11px;color:var(--mut);text-align:center;padding:4px}
.imgctrl{flex:1;min-width:0}
.imgstatus{font-size:12.5px;margin-top:4px;color:var(--mut)}
.imgstatus.ok{color:#1f7a3d;font-weight:700}
.imgstatus.bad{color:#c0392b;font-weight:700}

.imglist{display:flex;flex-direction:column;gap:10px;margin-bottom:10px}
.imglist .imgfield{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px}
.rmimg{flex:none;align-self:center;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);
       background:#fff;color:#c0392b;cursor:pointer;font-size:14px;transition:background .2s}
.rmimg:hover{background:#fbe7e7}

.asset-grid{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.asset-item{display:flex;gap:14px;align-items:flex-start;border:1px solid var(--line);
            border-radius:14px;padding:14px;background:#fff;animation:popIn .3s var(--ease) both}
.asset-item .imgprev{width:96px;height:72px}
.asset-body{flex:1;min-width:0}
.asset-label{font-size:13px;font-weight:800;color:var(--g900);margin-bottom:6px}
.asset-body input{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;
                   font-size:14px;font-family:monospace}
.asset-body input:focus{outline:0;border-color:var(--g500)}

footer{background:var(--g900);color:#d9efdd;padding:28px 0;text-align:center;font-size:14px;margin-top:40px}

/* ---- trang Về dự án ---- */
.about-mission{font-size:18px;color:#2c4a37;max-width:52em;margin-bottom:8px}

.tl{position:relative;margin-top:18px;padding-left:8px}
.tl::before{content:"";position:absolute;left:19px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl-item{position:relative;display:flex;gap:18px;padding:0 0 28px}
.tl-item:last-child{padding-bottom:0}
.tl-dot{flex:none;width:40px;height:40px;border-radius:50%;background:var(--g500);color:#fff;
        display:grid;place-items:center;font-weight:800;font-size:15px;z-index:1;
        box-shadow:0 0 0 5px #fff}
.tl-body{padding-top:6px}
.tl-step{font-weight:800;color:var(--g900);font-size:16.5px}
.tl-text{color:var(--mut);font-size:14.5px;margin-top:3px;max-width:38em}

/* -- admin: hàng nhỏ có nút xoá -- */
.minirow{display:flex;gap:8px;margin-bottom:8px}
.minirow input,.minirow textarea{flex:1;border:1px solid var(--line);border-radius:10px;
     padding:9px 11px;font-size:14.5px}
.minirow input:focus,.minirow textarea:focus{outline:0;border-color:var(--g500)}

/* -- Kéo-thả (GrapesJS) -- */
#builder{position:fixed;inset:0;z-index:150;background:#fff;display:none;flex-direction:column}
#builder.on{display:flex}
.bd-top{display:flex;align-items:center;gap:8px;padding:10px 16px;
        background:var(--g900);color:#fff;flex:none}
.bd-top b{font-size:15px}
.bd-top .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.45)}
.bd-top .btn.ghost:hover{background:rgba(255,255,255,.14)}
.bd-body{flex:1;display:flex;min-height:0}
.bd-side{width:250px;flex:none;overflow-y:auto;background:#fafcfa;border-right:1px solid var(--line)}
.bd-right{border-right:0;border-left:1px solid var(--line)}
.bd-sect{padding:10px 14px;font-size:11.5px;font-weight:800;letter-spacing:.06em;
         text-transform:uppercase;color:var(--g700);background:var(--g100);position:sticky;top:0;z-index:2}
#gjs{flex:1;min-width:0}
@media(max-width:880px){
  .bd-side{display:none}
}

/* ================= MOBILE ================= */
@media(max-width:880px){
  .menu{display:none;position:absolute;top:72px;left:0;right:0;background:#fff;
        flex-direction:column;gap:0;padding:8px 20px 16px;border-bottom:1px solid var(--line);
        animation:slideDown .25s var(--ease)}
  .menu.open{display:flex}
  .menu a{padding:12px 0;border-bottom:1px solid var(--line)}
  .burger{display:block}
  .hero{grid-template-columns:1fr}
  .hero-photo{order:-1;aspect-ratio:16/11}
  .hero-photo img{object-position:62% center}
  .hero-photo::after{content:"";position:absolute;left:0;right:0;bottom:0;height:26%;
       background:linear-gradient(180deg,#eaf7ec00,#eff9f0 78%,#eff9f0)}
  .hero-txt{text-align:center;padding:18px 20px 34px}
  .hero-lead{margin-left:auto;margin-right:auto}
  .hero .leaf,.hero .wave{display:none}
  .page{padding:32px 0}
  .page h1{font-size:26px}
  .tree-head{grid-template-columns:1fr;gap:20px}
  .tree-head .gallery{order:-1}
  .thumbs img{width:64px;height:50px}
  .arrow{opacity:1;width:38px;height:38px}
  .info{margin-top:26px}
  .info .box{padding:16px 18px}
  .cols{grid-template-columns:1fr}
  .adm-bar{position:static}
}
@media print{
  header,footer,.noprint{display:none!important}
  .qr-grid{grid-template-columns:repeat(3,1fr)}
  .qr-item{break-inside:avoid;border-color:#999;animation:none}
}
</style>
</head>
<body>

<header id="hdr">
  <div class="wrap nav">
    <a href="#/" class="logo">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21c0-6 3-10 8-12-1 7-4 10-8 12z"/><path d="M12 21C9 16 5 14 2 14c2 5 6 7 10 7z"/></svg>
      <span id="brand"></span>
    </a>
    <nav class="menu" id="menu"></nav>
    <button class="burger" id="burger" aria-label="Menu">&#9776;</button>
  </div>
</header>

<div id="view"></div>

<div id="scan">
  <div class="panel">
    <div class="top">
      <b>Quét mã QR trên cây</b>
      <button class="x" onclick="closeScanner()" aria-label="Đóng">&times;</button>
    </div>
    <div id="reader"></div>
    <div class="msg" id="scanMsg">Đưa camera vào mã QR gắn trên thân cây.</div>
  </div>
</div>

<div id="builder">
  <div class="bd-top noprint">
    <b id="bdTitle">Kéo-thả</b>
    <span style="flex:1"></span>
    <button class="btn ghost sm" onclick="gjsDevice('desktop')">🖥️</button>
    <button class="btn ghost sm" onclick="gjsDevice('mobile')">📱</button>
    <button class="btn ghost sm" onclick="gjsEditor&&gjsEditor.runCommand('core:undo')">↶</button>
    <button class="btn ghost sm" onclick="gjsEditor&&gjsEditor.runCommand('core:redo')">↷</button>
    <button class="btn ghost sm" onclick="closeBuilder()">Huỷ</button>
    <button class="btn sm" onclick="saveBuilder()">💾 Lưu</button>
  </div>
  <div class="bd-body">
    <aside class="bd-side bd-left">

function toast(msg){
  const el = document.createElement("div");
  el.className = "toast"; el.textContent = msg;

function cardHTML(t, i=0){ return `

/* hiện dần khi cuộn tới */
function observeReveal(){
  const io = new IntersectionObserver(es => es.forEach(e => {
    if(e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); }
  }), { threshold:.12 });
  $$(".reveal").forEach(el => io.observe(el));
}

/* ================= GALLERY (có phím mũi tên) ================= */
let GAL = { imgs:[], i:0 };

function galleryHTML(t){
  if(!t.imgs.length) return "";
  const multi = t.imgs.length > 1;
  return `
  <div class="gallery">
    <div class="frame" tabindex="0">
      <img class="main" id="mainImg" src="${t.imgs[0]}" alt="${esc(t.name)}"
           onerror="this.closest('.gallery').remove()">
      ${multi ? `
        <button class="arrow prev" onclick="galStep(-1)" aria-label="Ảnh trước">‹</button>
        <button class="arrow next" onclick="galStep(1)" aria-label="Ảnh sau">›</button>
        <span class="counter" id="galCount">1/${t.imgs.length}</span>` : ""}
    </div>
    ${multi ? `<div class="thumbs">
        ${t.imgs.map((src,k)=>`<img src="${src}" alt="" data-k="${k}"
           class="${k===0?'sel':''}" onclick="galGo(${k})" onerror="this.remove()">`).join("")}
      </div>
      <div class="hint">Dùng phím ← → để xem ảnh khác</div>` : ""}
  </div>`;
}

function galGo(k){
  if(!GAL.imgs.length) return;
  GAL.i = (k + GAL.imgs.length) % GAL.imgs.length;
  const img = $("#mainImg");
  if(!img) return;
  img.style.animation = "none"; void img.offsetWidth;
  img.style.animation = "";
  img.src = GAL.imgs[GAL.i];
  const c = $("#galCount"); if(c) c.textContent = (GAL.i+1) + "/" + GAL.imgs.length;
  $$(".thumbs img").forEach(x => x.classList.toggle("sel", +x.dataset.k === GAL.i));
}
const galStep = d => galGo(GAL.i + d);

addEventListener("keydown", e => {
  if($("#scan").classList.contains("on")) return;
  if(!GAL.imgs.length || GAL.imgs.length < 2) return;
  if(/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) return;
  if(e.key === "ArrowLeft"){ galStep(-1); e.preventDefault(); }
  if(e.key === "ArrowRight"){ galStep(1); e.preventDefault(); }
});

/* ================= QR ================= */
const QR_CDNS = [
  "https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js",
  "https://unpkg.com/qrcode@1.5.4/build/qrcode.min.js",
  "https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js",
  "https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"
];
function loadScript(src){
  return new Promise((ok,err)=>{
    const s = document.createElement("script");
    s.src = src; s.onload = ok; s.onerror = () => err(new Error(src));
    document.head.appendChild(s);
  });
}
const qrReady = () => (window.QRCode && QRCode.toCanvas) || typeof window.qrcode === "function";
async function loadQRLib(){
  if(qrReady()) return;
  for(const u of QR_CDNS){ try{ await loadScript(u); if(qrReady()) return; }catch(e){} }
  throw new Error("no-qr-lib");
}
function drawQR(cv, text){
  if(window.QRCode && QRCode.toCanvas){
    QRCode.toCanvas(cv, text, { width:520, margin:1, errorCorrectionLevel:"M",
                                color:{ dark:"#14532d", light:"#ffffff" } });
    return;
  }
  const qr = window.qrcode(0,"M"); qr.addData(text); qr.make();
  const n = qr.getModuleCount(), size = 520, cell = size / (n + 2), off = cell;
  cv.width = cv.height = size;
  const ctx = cv.getContext("2d");
  ctx.fillStyle = "#fff"; ctx.fillRect(0,0,size,size);
  ctx.fillStyle = "#14532d";
  for(let r=0;r<n;r++) for(let c=0;c<n;c++)
    if(qr.isDark(r,c)) ctx.fillRect(Math.round(off+c*cell), Math.round(off+r*cell),
                                    Math.ceil(cell), Math.ceil(cell));
}
async function renderQR(){
  const grid = $("#qrGrid");
  grid.innerHTML = "<p style='color:var(--mut)'>Đang tải thư viện tạo mã…</p>";
  try{ await loadQRLib(); }
  catch{
    grid.innerHTML = `<p style="color:#a33">Không tải được thư viện QR từ mọi CDN.
      <button class="btn ghost sm" style="margin-left:8px" onclick="renderQR()">Thử lại</button></p>`;
    return;
  }
  grid.innerHTML = CONFIG.trees.map((t,i) => `
    <div class="qr-item" style="animation-delay:${i*40}ms">
      <canvas data-slug="${t.slug}"></canvas>
      <div class="nm">${esc(t.name)}</div>
      <div class="sc">${esc(t.sci)}</div>
      <div class="url noprint">${baseURL()}#/cay/${t.slug}</div>
    </div>`).join("");
  $$("#qrGrid canvas").forEach(cv => {
    drawQR(cv, baseURL() + "#/cay/" + cv.dataset.slug);
    cv.title = "Bấm để tải PNG";
    cv.onclick = () => saveCanvas(cv, cv.dataset.slug);
  });
}
function saveCanvas(cv, name){
  const a = document.createElement("a");
  a.download = "qr-" + name + ".png"; a.href = cv.toDataURL("image/png"); a.click();
}
function downloadAllQR(){

let qrScanner = null;
async function loadScanLib(){
  if(window.Html5Qrcode) return;
  const urls = [
    "https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js",
    "https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js",
    "https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"
  ];
  for(const u of urls){ try{ await loadScript(u); if(window.Html5Qrcode) return; }catch(e){} }
  throw new Error("no-scan-lib");
}
async function openScanner(){
  const box = $("#scan"), msg = $("#scanMsg");
  box.classList.add("on"); msg.textContent = "Đang mở camera…";
  try{ await loadScanLib(); }
  catch{ msg.innerHTML = 'Không tải được thư viện quét. <a href="#/danh-sach" onclick="closeScanner()">Xem danh sách cây →</a>'; return; }
  try{
    qrScanner = new Html5Qrcode("reader", { verbose:false });
    await qrScanner.start({ facingMode:"environment" },
      { fps:10, qrbox:{ width:230, height:230 } }, onScanned, ()=>{});
    msg.textContent = "Đưa camera vào mã QR gắn trên thân cây.";
  }catch(e){
    msg.innerHTML = 'Không mở được camera (cần HTTPS và quyền truy cập). '
                  + '<a href="#/danh-sach" onclick="closeScanner()">Xem danh sách cây →</a>';
  }
}
function onScanned(text){
  const m = String(text).match(/#\/cay\/([a-z0-9-]+)/i);
  if(m && idxOf(m[1]) > -1){ closeScanner(); location.hash = "#/cay/" + m[1]; return; }
  $("#scanMsg").innerHTML = /^https?:\/\//i.test(text)
    ? `Mã này không thuộc Green Map: <a href="${esc(text)}" target="_blank" rel="noopener">${esc(text)}</a>`
    : `Nội dung mã: <b>${esc(String(text).slice(0,120))}</b>`;
}
function closeScanner(){
  $("#scan").classList.remove("on");
  if(qrScanner){ qrScanner.stop().then(()=>qrScanner.clear()).catch(()=>{}); qrScanner = null; }
}
$("#scan").addEventListener("click", e => { if(e.target.id === "scan") closeScanner(); });
addEventListener("keydown", e => { if(e.key === "Escape") closeScanner(); });

let gjsEditor = null, gjsPageKey = null, gjsCSSUrl = null;
const GJS_CSS = [
  "https://cdn.jsdelivr.net/npm/grapesjs@0.21.9/dist/css/grapes.min.css",
  "https://unpkg.com/grapesjs@0.21.9/dist/css/grapes.min.css"
];
const GJS_JS = [
  "https://cdn.jsdelivr.net/npm/grapesjs@0.21.9/dist/grapes.min.js",
  "https://unpkg.com/grapesjs@0.21.9/dist/grapes.min.js"
];
function loadLink(href){
  return new Promise((ok,err)=>{
    const l = document.createElement("link");
    l.rel = "stylesheet"; l.href = href; l.onload = ok; l.onerror = () => err(new Error(href));
    document.head.appendChild(l);
  });
}
async function loadGJS(){
  if(window.grapesjs) return;
  for(const u of GJS_CSS){ try{ await loadLink(u); break; }catch(e){} }
  for(const u of GJS_JS){ try{ await loadScript(u); if(window.grapesjs) return; }catch(e){} }
  if(!window.grapesjs) throw new Error("no-gjs");
}

/* ô nhập đường dẫn ảnh + xem trước + báo lỗi nếu file không tồn tại */
function imgField(label, path, val){
  const id = "img_" + path.replace(/\./g,"_");
  return `
  <div class="fld">
    <label>${label}</label>
    <div class="imgfield">
      <div class="imgprev" id="${id}_prev">
        ${val ? `<img src="${esc(val)}" onerror="this.replaceWith(imgBroken())">` : imgBrokenHTML(true)}
      </div>
      <div class="imgctrl">
        <input value="${esc(val)}" placeholder="assets/ten-file.webp"
               oninput="setField('${path}', this.value); checkImg('${id}', this.value)">
        <div class="imgstatus" id="${id}_status"></div>
      </div>
    </div>
  </div>`;
}
const imgBrokenHTML = empty => `<div class="imgph">${empty ? "chưa có" : "⚠ lỗi"}</div>`;
function imgBroken(){ const d=document.createElement("div"); d.className="imgph"; d.textContent="⚠ lỗi"; return d; }

function checkImg(id, src){
  const status = document.getElementById(id+"_status");
  const prev = document.getElementById(id+"_prev");
  if(!status) return;
  if(!src){ status.textContent=""; prev.innerHTML = imgBrokenHTML(true); return; }
  status.textContent = "Đang kiểm tra…"; status.className = "imgstatus";
  const test = new Image();
  test.onload = () => {
    status.textContent = "✓ Ảnh tồn tại"; status.className = "imgstatus ok";
    prev.innerHTML = `<img src="${esc(src)}">`;
  };
  test.onerror = () => {
    status.textContent = "✗ Không tìm thấy file — kiểm tra lại tên/đuôi"; status.className = "imgstatus bad";
    prev.innerHTML = imgBrokenHTML(false);
  };
  test.src = src + (src.includes("?") ? "&" : "?") + "chk=" + Date.now();
}

      <span class="rowbtn" onclick="event.preventDefault();event.stopPropagation()">
        <button onclick="moveTree(${i},-1)" title="Lên">↑</button>
        <button onclick="moveTree(${i},1)" title="Xuống">↓</button>
        <button onclick="delTree(${i})" title="Xoá">🗑</button>
      </span>
    </summary>
    <div class="body">
      <div class="cols">
        ${F("Tên thường","trees."+i+".name",t.name)}
        ${F("Tên khoa học","trees."+i+".sci",t.sci)}
      </div>
      <div class="cols">
        ${F("Họ thực vật","trees."+i+".family",t.family||"")}
        ${F("Tên gọi khác","trees."+i+".alias",t.alias||"")}
      </div>
      ${F("Slug (đường dẫn QR — đổi là QR cũ chết)","trees."+i+".slug",t.slug)}

      <label style="display:block;font-size:12.5px;font-weight:800;color:var(--g700);
             text-transform:uppercase;letter-spacing:.04em;margin:14px 0 6px">Ảnh (${(t.imgs||[]).length})</label>
      <div class="imglist">
        ${(t.imgs||[]).map((src,k) => `
          <div class="imgfield">
            <div class="imgprev" id="t${i}_${k}_prev">
              <img src="${esc(src)}" onerror="this.replaceWith(imgBroken())">
            </div>
            <div class="imgctrl">
              <input value="${esc(src)}" placeholder="assets/ten-file.webp"
                     oninput="setTreeImg(${i},${k},this.value)">
              <div class="imgstatus" id="t${i}_${k}_status"></div>
            </div>
            <button class="rmimg" onclick="delTreeImg(${i},${k})" title="Xoá ảnh này">✕</button>
          </div>`).join("") || `<div class="hint">Chưa có ảnh nào.</div>`}
      </div>
      <button class="btn ghost sm" onclick="addTreeImg(${i})">＋ Thêm ảnh</button>

      ${F("Đặc điểm nhận biết","trees."+i+".desc",t.desc||"","area")}
      ${F("Công dụng","trees."+i+".uses",t.uses||"","area")}
      ${F("Giá trị sinh thái","trees."+i+".eco",t.eco||"","area")}
      ${F("Điều thú vị","trees."+i+".fun",t.fun||"","area")}
      ${F("Nhãn mục thú vị (để trống = “Điều thú vị”)","trees."+i+".funLabel",t.funLabel||"")}
    </div>
  </details>`;
}

function setTreeImg(i,k,val){
  DRAFT.trees[i].imgs[k] = val;
  lsSet(JSON.stringify(DRAFT));
  checkImg(`t${i}_${k}`, val);
}
function addTreeImg(i){
  DRAFT.trees[i].imgs = DRAFT.trees[i].imgs || [];
  DRAFT.trees[i].imgs.push("assets/");
  refreshEditor();
}
function delTreeImg(i,k){
  DRAFT.trees[i].imgs.splice(k,1);
  refreshEditor();
}

function refreshEditor(){
  lsSet(JSON.stringify(DRAFT));
  $("#treeEditor").innerHTML = DRAFT.trees.map(treeEditor).join("");
}
function addTree(){
  DRAFT.trees.push({ slug:"cay-moi-"+Date.now().toString(36).slice(-4), name:"Cây mới", sci:"",
                     family:"", alias:"", imgs:[], desc:"", uses:"", eco:"", fun:"", funLabel:"" });
  refreshEditor(); toast("Đã thêm cây mới");
}
function delTree(i){
  if(!confirm("Xoá “" + DRAFT.trees[i].name + "”?")) return;
  DRAFT.trees.splice(i,1); refreshEditor(); toast("Đã xoá");
}
function moveTree(i,d){
  const j = i + d;
  if(j < 0 || j >= DRAFT.trees.length) return;
  [DRAFT.trees[i], DRAFT.trees[j]] = [DRAFT.trees[j], DRAFT.trees[i]];
  refreshEditor();
}
function adminExport(){
  const blob = new Blob([JSON.stringify(DRAFT,null,2)], { type:"application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "data.json"; a.click();
  URL.revokeObjectURL(a.href);
  toast("Đã tải data.json");
}
function adminApply(){
  CONFIG = JSON.parse(JSON.stringify(DRAFT));
  paintShell(); location.hash = "#/";
  toast("Đang xem thử bản nháp");
}
function adminReset(){
  if(!confirm("Bỏ mọi thay đổi và quay về bản gốc?")) return;
  lsDel(); DRAFT = JSON.parse(JSON.stringify(DATA)); CONFIG = JSON.parse(JSON.stringify(DATA));
  paintShell(); router(); toast("Đã khôi phục bản gốc");
}

/* ================= ROUTER ================= */
function paintShell(){
  $("#brand").textContent = CONFIG.brand;
  $("#foot").textContent  = CONFIG.footer;
  $("#menu").innerHTML = Object.entries(PAGES).filter(([,o]) => o.inMenu)
    .map(([p,o]) => `<a href="#${p}" data-path="${p}">${o.label}</a>`).join("");
}

function router(){
  const path = location.hash.replace(/^#/,"") || "/";
  let html, title, navPath = path, after = null;
  GAL = { imgs:[], i:0 };

  if(path.startsWith("/cay/")){
    const i = idxOf(path.slice(5));
    if(i > -1){
      const t = CONFIG.trees[i];
      html = treePage(t, i); title = t.name + " — Green Map"; navPath = "/danh-sach";
      GAL = { imgs: t.imgs.slice(), i:0 };
    }
  }
  if(!html){
    const page = PAGES[path] || PAGES["/"];
    html = page.render(); title = page.title; after = page.after;
    if(!PAGES[path]) navPath = "/";
  }

  document.title = title;
  $("#view").innerHTML = html;
  $$("#menu a").forEach(a => a.classList.toggle("active", a.dataset.path === navPath));
  $("#menu").classList.remove("open");
  window.scrollTo({ top:0, behavior:"instant" });
  observeReveal();
  if(after) after();
}

addEventListener("hashchange", router);
addEventListener("scroll", () => $("#hdr").classList.toggle("stuck", scrollY > 8), { passive:true });
$("#burger").onclick = () => $("#menu").classList.toggle("open");

/* nạp data.json nếu repo có, không thì dùng DATA gốc */
(async function boot(){
  try{
    const r = await fetch("data.json?v=" + Date.now(), { cache:"no-store" });
    if(r.ok) CONFIG = Object.assign(CONFIG, await r.json());
  }catch(e){}
  const draft = lsGet();
  if(draft){ try{ DRAFT = JSON.parse(draft); }catch(e){ lsDel(); } }
  paintShell();
  router();
})();
</script>
